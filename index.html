<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>手の速度・加速度ベクトル</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0b0c;
    --panel:#17181b;
    --text:#f5f5f5;
    --muted:#b5b7bd;
    --line:#31333a;
    --blue:#1683ff;
    --red:#ff3b30;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  }
  .app{
    width:min(1100px,100%);
    margin:0 auto;
    padding:12px 12px 28px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .title{
    font-size:clamp(20px,3vw,30px);
    font-weight:800;
    letter-spacing:.01em;
  }
  .legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:center;
    font-size:clamp(15px,2vw,20px);
    font-weight:700;
  }
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .dot{width:13px;height:13px;border-radius:999px;display:inline-block}
  .blue{background:var(--blue)}
  .red{background:var(--red)}

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
    border-radius:18px;
    border:1px solid #2b2c31;
  }
  video,canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  video{
    transform:scaleX(-1);
    object-fit:fill;
    background:#000;
  }
  canvas{
    pointer-events:none;
  }
  .hud{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:12px;
  }
  .hud-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .badge{
    background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(7px);
    border-radius:12px;
    padding:8px 11px;
    font-weight:700;
    font-size:clamp(13px,1.8vw,18px);
    line-height:1.25;
  }
  .accel-on{color:#ff8c86}
  .accel-off{color:#d3d4d8}
  .message{
    align-self:center;
    margin-bottom:4%;
    font-size:clamp(22px,4.5vw,52px);
    font-weight:900;
    text-shadow:0 3px 18px #000,0 1px 2px #000;
    opacity:0;
    transform:scale(.94);
    transition:opacity .15s ease, transform .15s ease;
  }
  .message.show{opacity:1;transform:scale(1)}

  .controls{
    margin-top:12px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  button{
    appearance:none;
    border:0;
    border-radius:12px;
    min-height:48px;
    padding:11px 18px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    background:#f2f2f3;
    color:#111;
  }
  button.secondary{
    background:#292b31;
    color:#fff;
    border:1px solid #3b3d45;
  }
  button.red{
    background:#3a2020;
    color:#ffd2cf;
    border:1px solid #6c2c28;
  }
  button:disabled{opacity:.5;cursor:default}
  .statusline{
    margin-left:auto;
    color:var(--muted);
    font-size:14px;
    min-width:180px;
    text-align:right;
  }

  details{
    margin-top:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
  }
  summary{cursor:pointer;font-weight:800}
  .settings{
    display:grid;
    grid-template-columns:repeat(2,minmax(220px,1fr));
    gap:12px 18px;
    margin-top:12px;
  }
  .setting label{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:14px;
    color:var(--muted);
    margin-bottom:5px;
  }

  .range-hints{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:4px;
    color:#aeb3bd;
    font-size:12px;
    font-weight:650;
  }
  input[type="range"]{width:100%}
  .note{
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
    margin-top:8px;
  }

  @media (max-width:700px){
    .app{padding:8px 8px 22px}
    .stage{border-radius:12px}
    .settings{grid-template-columns:1fr}
    .statusline{width:100%;margin-left:0;text-align:left}
    button{flex:1 1 auto}
    .hud{padding:8px}
    .badge{padding:6px 8px}
  }
  @media (prefers-reduced-motion:reduce){
    .message{transition:none}
  }
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="title">手の速度・加速度ベクトル</div>
    <div class="legend" aria-label="ベクトルの凡例">
      <span><i class="dot blue"></i>速度 v</span>
      <span><i class="dot red"></i>加速度 a</span>
    </div>
  </div>

  <section class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="badge" id="accelBadge">加速度表示：<span class="accel-off">OFF</span></div>
      </div>
      <div class="message" id="message"></div>
    </div>
  </section>

  <div class="controls">
    <button id="startBtn">カメラ開始</button>
    <button class="secondary" id="toggleBtn" disabled>加速度 ON / OFF</button>
    <button class="secondary" id="resetBtn" disabled>ベクトルをリセット</button>
    <button class="red" id="stopBtn" disabled>停止</button>
    <div class="statusline" id="status">未開始</div>
  </div>

  <details>
    <summary>表示調整</summary>
    <div class="settings">
      <div class="setting">
        <label for="vScale"><span>速度ベクトル倍率</span><span id="vScaleValue">1.00</span></label>
        <input id="vScale" type="range" min="0.35" max="2.2" step="0.05" value="1">
      </div>
      <div class="setting">
        <label for="aScale"><span>加速度ベクトル倍率</span><span id="aScaleValue">1.00</span></label>
        <input id="aScale" type="range" min="0.25" max="2.5" step="0.05" value="1">
      </div>
      <div class="setting">
        <label for="smoothScale"><span>平滑化の強さ</span><span id="smoothScaleValue">60%</span></label>
        <input id="smoothScale" type="range" min="0" max="100" step="1" value="60">
        <div class="range-hints"><span>反応が速い</span><span>なめらか</span></div>
      </div>
    </div>
    <div class="note">
      矢印はカメラ画像上の位置変化から求めた相対ベクトルです。実空間の m/s・m/s² への較正はしていません。<br>
      加速度は微分ノイズが大きいため、位置→速度→加速度の順に平滑化しています。「平滑化の強さ」で、反応の速さと安定性のバランスを授業中に調整できます。
    </div>
  </details>
</main>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const startBtn = document.getElementById("startBtn");
const toggleBtn = document.getElementById("toggleBtn");
const resetBtn = document.getElementById("resetBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const accelBadge = document.getElementById("accelBadge");
const message = document.getElementById("message");
const vScale = document.getElementById("vScale");
const aScale = document.getElementById("aScale");
const smoothScale = document.getElementById("smoothScale");
const vScaleValue = document.getElementById("vScaleValue");
const aScaleValue = document.getElementById("aScaleValue");
const smoothScaleValue = document.getElementById("smoothScaleValue");

let handLandmarker = null;
let stream = null;
let running = false;
let rafId = null;
let lastInferenceMs = 0;
let lastVideoTime = -1;
let showAcceleration = false;
let messageTimer = null;

// iPad / iPhone は少し推論間隔を広げる
const ua = navigator.userAgent || "";
const isIOSLike = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const INFERENCE_INTERVAL_MS = isIOSLike ? 72 : 52;

// 運動量計算用状態
let filteredPos = null;
let previousPos = null;
let previousVel = {x:0,y:0};
let filteredVel = {x:0,y:0};
let filteredAcc = {x:0,y:0};
let previousSampleMs = null;
let lastSeenMs = null;

// 平滑化係数。スライダーが大きいほど alpha を小さくして、よりなめらかにする。
function smoothingAlphas(){
  const strength = Number(smoothScale.value) / 100;
  return {
    pos: lerp(0.80, 0.20, strength),
    vel: lerp(0.65, 0.08, strength),
    acc: lerp(0.45, 0.03, strength)
  };
}
const TRACK_GAP_RESET_MS = 260;

// ベクトル表示の基準倍率
const V_ARROW_TIME = 0.105;   // v(px/s) × この値 → 矢印長(px)
const A_ARROW_TIME2 = 0.085;  // a(px/s^2) × この値 → 矢印長(px)（初期版の10倍）


function setStatus(text){
  statusEl.textContent = text;
}

function lerp(a,b,t){ return a + (b-a)*t; }
function lerpPoint(a,b,t){ return {x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)}; }

function resetMotion(){
  filteredPos = null;
  previousPos = null;
  previousVel = {x:0,y:0};
  filteredVel = {x:0,y:0};
  filteredAcc = {x:0,y:0};
  previousSampleMs = null;
  lastSeenMs = null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function updateAccelBadge(){
  accelBadge.innerHTML = showAcceleration
    ? '加速度表示：<span class="accel-on">ON</span>'
    : '加速度表示：<span class="accel-off">OFF</span>';
}

function flashMessage(text){
  clearTimeout(messageTimer);
  message.textContent = text;
  message.classList.add("show");
  messageTimer = setTimeout(() => message.classList.remove("show"), 1100);
}

function toggleAcceleration(){
  showAcceleration = !showAcceleration;
  updateAccelBadge();
  flashMessage(showAcceleration ? "加速度 ON" : "加速度 OFF");
  // 表示切り替え直後の見かけ上の跳ねを避ける
  filteredAcc = {x:0,y:0};
}

function palmCenter(landmarks){
  // 手首 + 4つの指の付け根。指の開閉による中心移動を抑える。
  const ids = [0,5,9,13,17];
  let x=0, y=0;
  for(const i of ids){ x += landmarks[i].x; y += landmarks[i].y; }
  x /= ids.length;
  y /= ids.length;
  return {
    x:(1-x)*canvas.width, // 鏡表示に合わせる
    y:y*canvas.height
  };
}

function updateMotion(rawPos, now){
  if(lastSeenMs !== null && now - lastSeenMs > TRACK_GAP_RESET_MS){
    resetMotion();
  }
  lastSeenMs = now;

  if(!filteredPos){
    filteredPos = {...rawPos};
    previousPos = {...rawPos};
    previousSampleMs = now;
    return;
  }

  const alpha = smoothingAlphas();
  filteredPos = lerpPoint(filteredPos, rawPos, alpha.pos);
  const dt = (now - previousSampleMs)/1000;
  if(dt < 0.018) return;
  if(dt > 0.22){
    previousPos = {...filteredPos};
    previousSampleMs = now;
    previousVel = {x:0,y:0};
    filteredVel = {x:0,y:0};
    filteredAcc = {x:0,y:0};
    return;
  }

  const rawVel = {
    x:(filteredPos.x - previousPos.x)/dt,
    y:(filteredPos.y - previousPos.y)/dt
  };

  const newVel = {
    x:lerp(filteredVel.x, rawVel.x, alpha.vel),
    y:lerp(filteredVel.y, rawVel.y, alpha.vel)
  };

  const rawAcc = {
    x:(newVel.x - previousVel.x)/dt,
    y:(newVel.y - previousVel.y)/dt
  };

  filteredAcc = {
    x:lerp(filteredAcc.x, rawAcc.x, alpha.acc),
    y:lerp(filteredAcc.y, rawAcc.y, alpha.acc)
  };

  previousVel = {...newVel};
  filteredVel = newVel;
  previousPos = {...filteredPos};
  previousSampleMs = now;
}

function vectorMagnitude(v){ return Math.hypot(v.x,v.y); }

function clampVector(v, maxLen){
  const m = vectorMagnitude(v);
  if(m <= maxLen || m === 0) return v;
  const s = maxLen/m;
  return {x:v.x*s,y:v.y*s};
}

function drawArrow(start, vec, color, label, minLen=7){
  let v = clampVector(vec, Math.min(canvas.width,canvas.height)*0.46);
  const len = vectorMagnitude(v);
  if(len < minLen) return;

  const end = {x:start.x+v.x, y:start.y+v.y};
  const angle = Math.atan2(v.y,v.x);
  const head = Math.max(13, Math.min(28, len*0.22));
  const lineWidth = Math.max(5, Math.min(10, canvas.width/150));

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowColor = "rgba(0,0,0,.55)";
  ctx.shadowBlur = 5;

  ctx.beginPath();
  ctx.moveTo(start.x,start.y);
  ctx.lineTo(end.x,end.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(end.x,end.y);
  ctx.lineTo(end.x - head*Math.cos(angle-Math.PI/7), end.y - head*Math.sin(angle-Math.PI/7));
  ctx.lineTo(end.x - head*Math.cos(angle+Math.PI/7), end.y - head*Math.sin(angle+Math.PI/7));
  ctx.closePath();
  ctx.fill();

  const fs = Math.max(22,Math.min(40,canvas.width/34));
  ctx.font = `900 ${fs}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineWidth = 7;
  ctx.strokeStyle = "rgba(0,0,0,.8)";
  const tx = end.x + Math.cos(angle)*24;
  const ty = end.y + Math.sin(angle)*24;
  ctx.strokeText(label,tx,ty);
  ctx.fillStyle = color;
  ctx.fillText(label,tx,ty);
  ctx.restore();
}

function drawFrame(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!filteredPos) return;

  // 手の中心
  ctx.save();
  ctx.beginPath();
  ctx.arc(filteredPos.x,filteredPos.y,10,0,Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(0,0,0,.75)";
  ctx.stroke();
  ctx.restore();

  const velScaleFactor = Number(vScale.value);
  const accScaleFactor = Number(aScale.value);

  const vVec = {
    x:filteredVel.x * V_ARROW_TIME * velScaleFactor,
    y:filteredVel.y * V_ARROW_TIME * velScaleFactor
  };
  drawArrow(filteredPos,vVec,"#1683ff","v",8);

  if(showAcceleration){
    const aVec = {
      x:filteredAcc.x * A_ARROW_TIME2 * accScaleFactor,
      y:filteredAcc.y * A_ARROW_TIME2 * accScaleFactor
    };
    drawArrow(filteredPos,aVec,"#ff3b30","a",9);
  }
}

async function initHandLandmarker(){
  if(handLandmarker) return;
  setStatus("手の認識モデルを読み込み中…");
  const vision = await FilesetResolver.forVisionTasks(WASM_URL);

  const options = {
    baseOptions:{ modelAssetPath:MODEL_URL, delegate:"GPU" },
    runningMode:"VIDEO",
    numHands:1,
    minHandDetectionConfidence:0.55,
    minHandPresenceConfidence:0.55,
    minTrackingConfidence:0.55
  };

  try{
    handLandmarker = await HandLandmarker.createFromOptions(vision,options);
  }catch(err){
    console.warn("GPU delegate unavailable. Falling back to CPU.",err);
    options.baseOptions.delegate = "CPU";
    handLandmarker = await HandLandmarker.createFromOptions(vision,options);
  }
}

async function startCamera(){
  if(running) return;
  startBtn.disabled = true;
  try{
    await initHandLandmarker();
    setStatus("カメラを起動中…");
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720},
        frameRate:{ideal:30,max:60}
      },
      audio:false
    });
    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    stage.style.aspectRatio = `${canvas.width} / ${canvas.height}`;

    running = true;
    toggleBtn.disabled = false;
    resetBtn.disabled = false;
    stopBtn.disabled = false;
    startBtn.textContent = "カメラ動作中";
    setStatus(`追跡中（${isIOSLike ? "iPad/iPhone向け" : "Mac/PC向け"}設定）`);
    resetMotion();
    loop();
  }catch(err){
    console.error(err);
    setStatus("カメラを開始できません。Safari/Chromeのカメラ許可を確認してください。");
    startBtn.disabled = false;
  }
}

function stopCamera(){
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if(stream){
    for(const track of stream.getTracks()) track.stop();
    stream = null;
  }
  video.srcObject = null;
  resetMotion();
  startBtn.disabled = false;
  startBtn.textContent = "カメラ開始";
  toggleBtn.disabled = true;
  resetBtn.disabled = true;
  stopBtn.disabled = true;
  setStatus("停止中");
}

function loop(){
  if(!running) return;
  const now = performance.now();

  if(video.readyState >= 2 && now - lastInferenceMs >= INFERENCE_INTERVAL_MS && video.currentTime !== lastVideoTime){
    lastInferenceMs = now;
    lastVideoTime = video.currentTime;

    try{
      const result = handLandmarker.detectForVideo(video,now);
      if(result.landmarks && result.landmarks.length > 0){
        const landmarks = result.landmarks[0];
        const p = palmCenter(landmarks);
        updateMotion(p,now);

        setStatus("手を追跡中");
      }else{
        if(lastSeenMs !== null && now - lastSeenMs > TRACK_GAP_RESET_MS){
          resetMotion();
        }
        setStatus("手をカメラに映してください");
      }
    }catch(err){
      console.warn(err);
    }
  }

  drawFrame();
  rafId = requestAnimationFrame(loop);
}

startBtn.addEventListener("click",startCamera);
stopBtn.addEventListener("click",stopCamera);
toggleBtn.addEventListener("click",toggleAcceleration);
resetBtn.addEventListener("click",()=>{
  resetMotion();
  flashMessage("ベクトルをリセット");
});

vScale.addEventListener("input",()=>{ vScaleValue.textContent = Number(vScale.value).toFixed(2); });
aScale.addEventListener("input",()=>{ aScaleValue.textContent = Number(aScale.value).toFixed(2); });
smoothScale.addEventListener("input",()=>{
  smoothScaleValue.textContent = `${Number(smoothScale.value)}%`;
});


window.addEventListener("pagehide",()=>{
  if(stream){ for(const track of stream.getTracks()) track.stop(); }
});

updateAccelBadge();
</script>
</body>
</html>
