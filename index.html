<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>手の速度・加速度ベクトル</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0b0c;
    --panel:#17181b;
    --text:#f5f5f5;
    --muted:#b5b7bd;
    --line:#31333a;
    --blue:#1683ff;
    --red:#ff3b30;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  }
  .app{
    width:min(1100px,100%);
    margin:0 auto;
    padding:12px 12px 28px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .title{
    font-size:clamp(20px,3vw,30px);
    font-weight:800;
    letter-spacing:.01em;
  }
  .legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:center;
    font-size:clamp(15px,2vw,20px);
    font-weight:700;
  }
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .dot{width:13px;height:13px;border-radius:999px;display:inline-block}
  .blue{background:var(--blue)}
  .red{background:var(--red)}

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
    border-radius:18px;
    border:1px solid #2b2c31;
  }
  video,canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  video{
    transform:scaleX(-1);
    object-fit:fill;
    background:#000;
  }
  canvas{
    pointer-events:none;
  }
  .hud{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:12px;
  }
  .hud-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .badge{
    background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(7px);
    border-radius:12px;
    padding:8px 11px;
    font-weight:700;
    font-size:clamp(13px,1.8vw,18px);
    line-height:1.25;
  }
  .accel-on{color:#ff8c86}
  .accel-off{color:#d3d4d8}
  .gesture-progress{
    display:flex;
    gap:6px;
    align-items:center;
    flex-wrap:wrap;
  }
  .step{
    min-width:39px;
    text-align:center;
    padding:5px 8px;
    border-radius:9px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    opacity:.55;
  }
  .step.done{
    opacity:1;
    border-color:rgba(255,255,255,.75);
    background:rgba(255,255,255,.18);
  }
  .message{
    align-self:center;
    margin-bottom:4%;
    font-size:clamp(22px,4.5vw,52px);
    font-weight:900;
    text-shadow:0 3px 18px #000,0 1px 2px #000;
    opacity:0;
    transform:scale(.94);
    transition:opacity .15s ease, transform .15s ease;
  }
  .message.show{opacity:1;transform:scale(1)}

  .controls{
    margin-top:12px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  button{
    appearance:none;
    border:0;
    border-radius:12px;
    min-height:48px;
    padding:11px 18px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    background:#f2f2f3;
    color:#111;
  }
  button.secondary{
    background:#292b31;
    color:#fff;
    border:1px solid #3b3d45;
  }
  button.red{
    background:#3a2020;
    color:#ffd2cf;
    border:1px solid #6c2c28;
  }
  button:disabled{opacity:.5;cursor:default}
  .statusline{
    margin-left:auto;
    color:var(--muted);
    font-size:14px;
    min-width:180px;
    text-align:right;
  }

  details{
    margin-top:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
  }
  summary{cursor:pointer;font-weight:800}
  .settings{
    display:grid;
    grid-template-columns:repeat(2,minmax(220px,1fr));
    gap:12px 18px;
    margin-top:12px;
  }
  .setting label{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:14px;
    color:var(--muted);
    margin-bottom:5px;
  }
  input[type="range"]{width:100%}
  .note{
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
    margin-top:8px;
  }

  @media (max-width:700px){
    .app{padding:8px 8px 22px}
    .stage{border-radius:12px}
    .settings{grid-template-columns:1fr}
    .statusline{width:100%;margin-left:0;text-align:left}
    button{flex:1 1 auto}
    .hud{padding:8px}
    .badge{padding:6px 8px}
  }
  @media (prefers-reduced-motion:reduce){
    .message{transition:none}
  }
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="title">手の速度・加速度ベクトル</div>
    <div class="legend" aria-label="ベクトルの凡例">
      <span><i class="dot blue"></i>速度 v</span>
      <span><i class="dot red"></i>加速度 a</span>
    </div>
  </div>

  <section class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="badge" id="accelBadge">加速度表示：<span class="accel-off">OFF</span></div>
        <div class="badge gesture-progress" aria-label="ジェスチャー進行状況">
          <span class="step" id="g1">✊</span><span>→</span>
          <span class="step" id="g2">✋</span><span>→</span>
          <span class="step" id="g3">✊</span>
        </div>
      </div>
      <div class="message" id="message"></div>
    </div>
  </section>

  <div class="controls">
    <button id="startBtn">カメラ開始</button>
    <button class="secondary" id="toggleBtn" disabled>加速度 ON / OFF</button>
    <button class="secondary" id="resetBtn" disabled>ベクトルをリセット</button>
    <button class="red" id="stopBtn" disabled>停止</button>
    <div class="statusline" id="status">未開始</div>
  </div>

  <details>
    <summary>表示調整</summary>
    <div class="settings">
      <div class="setting">
        <label for="vScale"><span>速度ベクトル倍率</span><span id="vScaleValue">1.00</span></label>
        <input id="vScale" type="range" min="0.35" max="2.2" step="0.05" value="1">
      </div>
      <div class="setting">
        <label for="aScale"><span>加速度ベクトル倍率</span><span id="aScaleValue">1.00</span></label>
        <input id="aScale" type="range" min="0.25" max="2.5" step="0.05" value="1">
      </div>
    </div>
    <div class="note">
      矢印はカメラ画像上の位置変化から求めた相対ベクトルです。実空間の m/s・m/s² への較正はしていません。<br>
      加速度は微分ノイズが大きいため、位置→速度→加速度の順に平滑化しています。Aキーでも加速度表示を切り替えられます。
    </div>
  </details>
</main>

<script type="module">
import {
  FilesetResolver,
  GestureRecognizer
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task";
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const startBtn = document.getElementById("startBtn");
const toggleBtn = document.getElementById("toggleBtn");
const resetBtn = document.getElementById("resetBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const accelBadge = document.getElementById("accelBadge");
const message = document.getElementById("message");
const g1 = document.getElementById("g1");
const g2 = document.getElementById("g2");
const g3 = document.getElementById("g3");
const vScale = document.getElementById("vScale");
const aScale = document.getElementById("aScale");
const vScaleValue = document.getElementById("vScaleValue");
const aScaleValue = document.getElementById("aScaleValue");

let recognizer = null;
let stream = null;
let running = false;
let rafId = null;
let lastInferenceMs = 0;
let lastVideoTime = -1;
let showAcceleration = false;
let messageTimer = null;

// iPad / iPhone は少し推論間隔を広げる
const ua = navigator.userAgent || "";
const isIOSLike = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const INFERENCE_INTERVAL_MS = isIOSLike ? 72 : 52;

// 運動量計算用状態
let filteredPos = null;
let previousPos = null;
let previousVel = {x:0,y:0};
let filteredVel = {x:0,y:0};
let filteredAcc = {x:0,y:0};
let previousSampleMs = null;
let lastSeenMs = null;

// 平滑化係数（0に近いほどなめらか、1に近いほど反応が速い）
const POS_ALPHA = 0.48;
const VEL_ALPHA = 0.30;
const ACC_ALPHA = 0.16;
const TRACK_GAP_RESET_MS = 260;

// ベクトル表示の基準倍率
const V_ARROW_TIME = 0.105;   // v(px/s) × この値 → 矢印長(px)
const A_ARROW_TIME2 = 0.085; // a(px/s^2) × この値 → 矢印長(px)

// G → P → G ジェスチャー状態
let gestureStage = 0; // 0:待機, 1:最初のG済み, 2:P済み
let gestureDeadline = 0;
let cooldownUntil = 0;
let gestureCandidate = "None";
let gestureCandidateSince = 0;
let stableGesture = "None";
const GESTURE_SCORE_MIN = 0.64;
const GESTURE_STABLE_MS = 170;
const GESTURE_STEP_TIMEOUT_MS = 2600;

function setStatus(text){
  statusEl.textContent = text;
}

function lerp(a,b,t){ return a + (b-a)*t; }
function lerpPoint(a,b,t){ return {x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)}; }

function resetMotion(){
  filteredPos = null;
  previousPos = null;
  previousVel = {x:0,y:0};
  filteredVel = {x:0,y:0};
  filteredAcc = {x:0,y:0};
  previousSampleMs = null;
  lastSeenMs = null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function updateAccelBadge(){
  accelBadge.innerHTML = showAcceleration
    ? '加速度表示：<span class="accel-on">ON</span>'
    : '加速度表示：<span class="accel-off">OFF</span>';
}

function flashMessage(text){
  clearTimeout(messageTimer);
  message.textContent = text;
  message.classList.add("show");
  messageTimer = setTimeout(() => message.classList.remove("show"), 1100);
}

function toggleAcceleration(source="button"){
  showAcceleration = !showAcceleration;
  updateAccelBadge();
  flashMessage(showAcceleration ? "加速度 ON" : "加速度 OFF");
  if(source === "gesture"){
    // 切り替え直後の指の開閉で加速度が跳ねるのを少し軽減
    filteredAcc = {x:0,y:0};
  }
}

function updateGestureUI(){
  g1.classList.toggle("done", gestureStage >= 1);
  g2.classList.toggle("done", gestureStage >= 2);
  g3.classList.toggle("done", false);
}

function resetGestureSequence(){
  gestureStage = 0;
  gestureDeadline = 0;
  updateGestureUI();
}

function processStableGesture(name, now){
  if(now < cooldownUntil) return;

  if(gestureStage > 0 && now > gestureDeadline){
    resetGestureSequence();
  }

  if(gestureStage === 0){
    if(name === "Closed_Fist"){
      gestureStage = 1;
      gestureDeadline = now + GESTURE_STEP_TIMEOUT_MS;
      updateGestureUI();
    }
    return;
  }

  if(gestureStage === 1){
    if(name === "Open_Palm"){
      gestureStage = 2;
      gestureDeadline = now + GESTURE_STEP_TIMEOUT_MS;
      updateGestureUI();
    }
    return;
  }

  if(gestureStage === 2 && name === "Closed_Fist"){
    g3.classList.add("done");
    toggleAcceleration("gesture");
    cooldownUntil = now + 1400;
    setTimeout(resetGestureSequence, 650);
  }
}

function updateGestureRecognition(name, score, now){
  const accepted = score >= GESTURE_SCORE_MIN && (name === "Closed_Fist" || name === "Open_Palm");
  const current = accepted ? name : "None";

  if(current !== gestureCandidate){
    gestureCandidate = current;
    gestureCandidateSince = now;
    return;
  }

  if(current !== stableGesture && now - gestureCandidateSince >= GESTURE_STABLE_MS){
    stableGesture = current;
    processStableGesture(stableGesture, now);
  }

  // 同じ安定ジェスチャーが続いている場合もタイムアウト監視だけ行う
  if(gestureStage > 0 && now > gestureDeadline){
    resetGestureSequence();
  }
}

function palmCenter(landmarks){
  // 手首 + 4つの指の付け根。指の開閉による中心移動を抑える。
  const ids = [0,5,9,13,17];
  let x=0, y=0;
  for(const i of ids){ x += landmarks[i].x; y += landmarks[i].y; }
  x /= ids.length;
  y /= ids.length;
  return {
    x:(1-x)*canvas.width, // 鏡表示に合わせる
    y:y*canvas.height
  };
}

function updateMotion(rawPos, now){
  if(lastSeenMs !== null && now - lastSeenMs > TRACK_GAP_RESET_MS){
    resetMotion();
  }
  lastSeenMs = now;

  if(!filteredPos){
    filteredPos = {...rawPos};
    previousPos = {...rawPos};
    previousSampleMs = now;
    return;
  }

  filteredPos = lerpPoint(filteredPos, rawPos, POS_ALPHA);
  const dt = (now - previousSampleMs)/1000;
  if(dt < 0.018) return;
  if(dt > 0.22){
    previousPos = {...filteredPos};
    previousSampleMs = now;
    previousVel = {x:0,y:0};
    filteredVel = {x:0,y:0};
    filteredAcc = {x:0,y:0};
    return;
  }

  const rawVel = {
    x:(filteredPos.x - previousPos.x)/dt,
    y:(filteredPos.y - previousPos.y)/dt
  };

  const newVel = {
    x:lerp(filteredVel.x, rawVel.x, VEL_ALPHA),
    y:lerp(filteredVel.y, rawVel.y, VEL_ALPHA)
  };

  const rawAcc = {
    x:(newVel.x - previousVel.x)/dt,
    y:(newVel.y - previousVel.y)/dt
  };

  filteredAcc = {
    x:lerp(filteredAcc.x, rawAcc.x, ACC_ALPHA),
    y:lerp(filteredAcc.y, rawAcc.y, ACC_ALPHA)
  };

  previousVel = {...newVel};
  filteredVel = newVel;
  previousPos = {...filteredPos};
  previousSampleMs = now;
}

function vectorMagnitude(v){ return Math.hypot(v.x,v.y); }

function clampVector(v, maxLen){
  const m = vectorMagnitude(v);
  if(m <= maxLen || m === 0) return v;
  const s = maxLen/m;
  return {x:v.x*s,y:v.y*s};
}

function drawArrow(start, vec, color, label, minLen=7){
  let v = clampVector(vec, Math.min(canvas.width,canvas.height)*0.46);
  const len = vectorMagnitude(v);
  if(len < minLen) return;

  const end = {x:start.x+v.x, y:start.y+v.y};
  const angle = Math.atan2(v.y,v.x);
  const head = Math.max(13, Math.min(28, len*0.22));
  const lineWidth = Math.max(5, Math.min(10, canvas.width/150));

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowColor = "rgba(0,0,0,.55)";
  ctx.shadowBlur = 5;

  ctx.beginPath();
  ctx.moveTo(start.x,start.y);
  ctx.lineTo(end.x,end.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(end.x,end.y);
  ctx.lineTo(end.x - head*Math.cos(angle-Math.PI/7), end.y - head*Math.sin(angle-Math.PI/7));
  ctx.lineTo(end.x - head*Math.cos(angle+Math.PI/7), end.y - head*Math.sin(angle+Math.PI/7));
  ctx.closePath();
  ctx.fill();

  const fs = Math.max(22,Math.min(40,canvas.width/34));
  ctx.font = `900 ${fs}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineWidth = 7;
  ctx.strokeStyle = "rgba(0,0,0,.8)";
  const tx = end.x + Math.cos(angle)*24;
  const ty = end.y + Math.sin(angle)*24;
  ctx.strokeText(label,tx,ty);
  ctx.fillStyle = color;
  ctx.fillText(label,tx,ty);
  ctx.restore();
}

function drawFrame(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!filteredPos) return;

  // 手の中心
  ctx.save();
  ctx.beginPath();
  ctx.arc(filteredPos.x,filteredPos.y,10,0,Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(0,0,0,.75)";
  ctx.stroke();
  ctx.restore();

  const velScaleFactor = Number(vScale.value);
  const accScaleFactor = Number(aScale.value);

  const vVec = {
    x:filteredVel.x * V_ARROW_TIME * velScaleFactor,
    y:filteredVel.y * V_ARROW_TIME * velScaleFactor
  };
  drawArrow(filteredPos,vVec,"#1683ff","v",8);

  if(showAcceleration){
    const aVec = {
      x:filteredAcc.x * A_ARROW_TIME2 * accScaleFactor,
      y:filteredAcc.y * A_ARROW_TIME2 * accScaleFactor
    };
    drawArrow(filteredPos,aVec,"#ff3b30","a",9);
  }
}

async function initRecognizer(){
  if(recognizer) return;
  setStatus("手の認識モデルを読み込み中…");
  const vision = await FilesetResolver.forVisionTasks(WASM_URL);

  const options = {
    baseOptions:{ modelAssetPath:MODEL_URL, delegate:"GPU" },
    runningMode:"VIDEO",
    numHands:1,
    minHandDetectionConfidence:0.55,
    minHandPresenceConfidence:0.55,
    minTrackingConfidence:0.55
  };

  try{
    recognizer = await GestureRecognizer.createFromOptions(vision,options);
  }catch(err){
    console.warn("GPU delegate unavailable. Falling back to CPU.",err);
    options.baseOptions.delegate = "CPU";
    recognizer = await GestureRecognizer.createFromOptions(vision,options);
  }
}

async function startCamera(){
  if(running) return;
  startBtn.disabled = true;
  try{
    await initRecognizer();
    setStatus("カメラを起動中…");
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720},
        frameRate:{ideal:30,max:60}
      },
      audio:false
    });
    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    stage.style.aspectRatio = `${canvas.width} / ${canvas.height}`;

    running = true;
    toggleBtn.disabled = false;
    resetBtn.disabled = false;
    stopBtn.disabled = false;
    startBtn.textContent = "カメラ動作中";
    setStatus(`追跡中（${isIOSLike ? "iPad/iPhone向け" : "Mac/PC向け"}設定）`);
    resetMotion();
    resetGestureSequence();
    loop();
  }catch(err){
    console.error(err);
    setStatus("カメラを開始できません。Safari/Chromeのカメラ許可を確認してください。");
    startBtn.disabled = false;
  }
}

function stopCamera(){
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if(stream){
    for(const track of stream.getTracks()) track.stop();
    stream = null;
  }
  video.srcObject = null;
  resetMotion();
  resetGestureSequence();
  startBtn.disabled = false;
  startBtn.textContent = "カメラ開始";
  toggleBtn.disabled = true;
  resetBtn.disabled = true;
  stopBtn.disabled = true;
  setStatus("停止中");
}

function loop(){
  if(!running) return;
  const now = performance.now();

  if(video.readyState >= 2 && now - lastInferenceMs >= INFERENCE_INTERVAL_MS && video.currentTime !== lastVideoTime){
    lastInferenceMs = now;
    lastVideoTime = video.currentTime;

    try{
      const result = recognizer.recognizeForVideo(video,now);
      if(result.landmarks && result.landmarks.length > 0){
        const landmarks = result.landmarks[0];
        const p = palmCenter(landmarks);
        updateMotion(p,now);

        let gestureName = "None";
        let gestureScore = 0;
        if(result.gestures && result.gestures[0] && result.gestures[0][0]){
          gestureName = result.gestures[0][0].categoryName || "None";
          gestureScore = result.gestures[0][0].score || 0;
        }
        updateGestureRecognition(gestureName,gestureScore,now);
        setStatus(`手を追跡中 / ${gestureName === "Closed_Fist" ? "グー" : gestureName === "Open_Palm" ? "パー" : "-"}`);
      }else{
        if(lastSeenMs !== null && now - lastSeenMs > TRACK_GAP_RESET_MS){
          resetMotion();
        }
        updateGestureRecognition("None",0,now);
        setStatus("手をカメラに映してください");
      }
    }catch(err){
      console.warn(err);
    }
  }

  drawFrame();
  rafId = requestAnimationFrame(loop);
}

startBtn.addEventListener("click",startCamera);
stopBtn.addEventListener("click",stopCamera);
toggleBtn.addEventListener("click",()=>toggleAcceleration("button"));
resetBtn.addEventListener("click",()=>{
  resetMotion();
  flashMessage("ベクトルをリセット");
});

vScale.addEventListener("input",()=>{ vScaleValue.textContent = Number(vScale.value).toFixed(2); });
aScale.addEventListener("input",()=>{ aScaleValue.textContent = Number(aScale.value).toFixed(2); });

window.addEventListener("keydown",(e)=>{
  if((e.key === "a" || e.key === "A") && running && document.activeElement?.tagName !== "INPUT"){
    toggleAcceleration("keyboard");
  }
});

window.addEventListener("pagehide",()=>{
  if(stream){ for(const track of stream.getTracks()) track.stop(); }
});

updateAccelBadge();
updateGestureUI();
</script>
</body>
</html>
