<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>手の速度・加速度ベクトル記録</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0b0b0c;--panel:#17181b;--text:#f5f5f5;--muted:#b5b7bd;--line:#31333a;
    --blue:#1683ff;--red:#ff3b30;--rec:#ff453a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
  .app{width:min(1120px,100%);margin:0 auto;padding:12px 12px 28px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .title{font-size:clamp(20px,3vw,30px);font-weight:800}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:clamp(15px,2vw,20px);font-weight:700}
  .legend span{display:inline-flex;align-items:center;gap:7px}.dot{width:13px;height:13px;border-radius:999px;display:inline-block}.blue{background:var(--blue)}.red{background:var(--red)}
  .stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:18px;border:1px solid #2b2c31}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
  .stage video{transform:scaleX(-1);object-fit:fill;background:#000}
  #playbackVideo{display:none}
  .stage.playback #liveVideo{display:none}.stage.playback #playbackVideo{display:block}
  .stage canvas{pointer-events:none}
  .hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px}
  .hud-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .badge{background:rgba(0,0,0,.64);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(7px);border-radius:12px;padding:8px 11px;font-weight:750;font-size:clamp(13px,1.8vw,18px);line-height:1.25}
  .accel-on{color:#ff8c86}.accel-off{color:#d3d4d8}
  .record-badge{display:none;color:#fff}.record-badge.show{display:block}.rec-dot{display:inline-block;width:11px;height:11px;margin-right:7px;border-radius:50%;background:var(--rec);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .message{align-self:center;margin-bottom:4%;font-size:clamp(22px,4.5vw,52px);font-weight:900;text-shadow:0 3px 18px #000,0 1px 2px #000;opacity:0;transform:scale(.94);transition:opacity .15s ease,transform .15s ease}
  .message.show{opacity:1;transform:scale(1)}
  .message.countdown{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;font-size:clamp(110px,22vw,260px);line-height:1;font-variant-numeric:tabular-nums}
  .progress{position:absolute;left:0;bottom:0;height:7px;width:0;background:var(--rec);transition:width .08s linear}
  .controls{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{appearance:none;border:0;border-radius:12px;min-height:48px;padding:11px 18px;font-size:17px;font-weight:800;cursor:pointer;background:#f2f2f3;color:#111}
  button.secondary{background:#292b31;color:#fff;border:1px solid #3b3d45}button.red{background:#3a2020;color:#ffd2cf;border:1px solid #6c2c28}button.record{background:#d92f2a;color:#fff}button.play{background:#195f35;color:#eafff0;border:1px solid #287b49}button:disabled{opacity:.42;cursor:default}
  .statusline{margin-left:auto;color:var(--muted);font-size:14px;min-width:220px;text-align:right}
  details{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}summary{cursor:pointer;font-weight:800}
  .settings{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:12px 18px;margin-top:12px}.setting label{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-bottom:5px}.range-hints{display:flex;justify-content:space-between;gap:12px;margin-top:4px;color:#aeb3bd;font-size:12px;font-weight:650}input[type="range"]{width:100%}
  .note{color:var(--muted);font-size:13px;line-height:1.6;margin-top:9px}
  .record-info{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#111216;border:1px solid var(--line);border-radius:12px;padding:9px 11px;color:var(--muted);font-size:13px}.record-info strong{color:var(--text)}
  .graphs{display:none;margin-top:14px}
  .graphs.show{display:block}
  .graphs-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .graphs-title{font-size:18px;font-weight:850}
  .graphs-note{font-size:12px;color:var(--muted)}
  .graph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
  .graph-card{min-width:0;background:#111216;border:1px solid var(--line);border-radius:13px;padding:8px 9px 7px}
  .graph-title{font-family:"STIX Two Text","Times New Roman",Times,serif;font-size:40px;font-weight:700;line-height:1;text-align:center;margin:1px 0 5px;letter-spacing:.01em}
  .graph-title i{font-style:italic}.graph-title sub{font-size:.62em;vertical-align:-.28em;line-height:0}
  .graph-plot{position:relative;width:100%;height:178px;overflow:hidden;border-radius:7px}
  .graph-plot canvas{display:block;position:static;width:100%;height:100%;pointer-events:none}
  .graph-playhead{display:none;position:absolute;top:7px;bottom:22px;width:2px;background:#ffd60a;box-shadow:0 0 0 1px rgba(0,0,0,.32);pointer-events:none;transform:translateX(-1px)}
  .graphs.playing .graph-playhead,.graphs.paused .graph-playhead{display:block}
  @media(max-width:760px){.app{padding:8px 8px 22px}.stage{border-radius:12px}.settings{grid-template-columns:1fr}.statusline{width:100%;margin-left:0;text-align:left}button{flex:1 1 auto}.hud{padding:8px}.badge{padding:6px 8px}.record-info{grid-template-columns:1fr}.graph-grid{gap:8px}.graph-card{padding:7px 6px 5px}.graph-title{font-size:36px}.graph-plot{height:145px}}
  @media(prefers-reduced-motion:reduce){.message{transition:none}.rec-dot{animation:none}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="title">手の速度・加速度ベクトル</div>
    <div class="legend"><span><i class="dot blue"></i>速度 v</span><span><i class="dot red"></i>加速度 a</span></div>
  </div>

  <section class="stage" id="stage">
    <video id="liveVideo" autoplay playsinline muted></video>
    <video id="playbackVideo" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="hud-top">
        <div class="badge" id="accelBadge">加速度表示：<span class="accel-on">ON</span></div>
        <div class="badge record-badge" id="recordBadge"><span class="rec-dot"></span><span id="recordText">記録中 5.0 s</span></div>
      </div>
      <div class="message" id="message"></div>
    </div>
    <div class="progress" id="recordProgress"></div>
  </section>

  <div class="controls">
    <button id="startBtn">カメラ開始</button>
    <button class="record" id="recordBtn" disabled>● 5秒記録</button>
    <button class="play" id="playBtn" disabled>▶ 再生</button>
    <button class="secondary" id="pauseBtn" disabled>⏸ 一時停止</button>
    <button class="secondary" id="liveBtn" disabled>ライブに戻る</button>
    <button class="secondary" id="toggleBtn" disabled>加速度 ON / OFF</button>
    <button class="red" id="stopBtn" disabled>カメラ停止</button>
    <div class="statusline" id="status">未開始</div>
  </div>

  <section class="graphs" id="graphsSection" aria-label="5秒記録の運動グラフ">
    <div class="graphs-head">
      <div class="graphs-title">5秒間の運動グラフ</div>
      <div class="graphs-note">右向き +x ／ 上向き +y　・　各行の左右は同じ縦軸スケール</div>
    </div>
    <div class="graph-grid">
      <article class="graph-card">
        <div class="graph-title"><i>x</i>–<i>t</i></div>
        <div class="graph-plot"><canvas id="graphX"></canvas><div class="graph-playhead"></div></div>
      </article>
      <article class="graph-card">
        <div class="graph-title"><i>y</i>–<i>t</i></div>
        <div class="graph-plot"><canvas id="graphY"></canvas><div class="graph-playhead"></div></div>
      </article>
      <article class="graph-card">
        <div class="graph-title"><i>v</i><sub>x</sub>–<i>t</i></div>
        <div class="graph-plot"><canvas id="graphVx"></canvas><div class="graph-playhead"></div></div>
      </article>
      <article class="graph-card">
        <div class="graph-title"><i>v</i><sub>y</sub>–<i>t</i></div>
        <div class="graph-plot"><canvas id="graphVy"></canvas><div class="graph-playhead"></div></div>
      </article>
      <article class="graph-card">
        <div class="graph-title"><i>a</i><sub>x</sub>–<i>t</i></div>
        <div class="graph-plot"><canvas id="graphAx"></canvas><div class="graph-playhead"></div></div>
      </article>
      <article class="graph-card">
        <div class="graph-title"><i>a</i><sub>y</sub>–<i>t</i></div>
        <div class="graph-plot"><canvas id="graphAy"></canvas><div class="graph-playhead"></div></div>
      </article>
    </div>
  </section>

  <details>
    <summary>表示・平滑化調整</summary>
    <div class="settings">
      <div class="setting">
        <label for="vScale"><span>速度ベクトル倍率</span><span id="vScaleValue">2.00</span></label>
        <input id="vScale" type="range" min="0.35" max="4" step="0.05" value="2">
      </div>
      <div class="setting">
        <label for="aScale"><span>加速度ベクトル倍率</span><span id="aScaleValue">1.00</span></label>
        <input id="aScale" type="range" min="0.1" max="2.5" step="0.05" value="1">
      </div>
      <div class="setting">
        <label for="smoothScale"><span>平滑化の強さ</span><span id="smoothScaleValue">20%</span></label>
        <input id="smoothScale" type="range" min="0" max="100" step="1" value="20">
      </div>
    </div>
    <span id="clipInfo" hidden>記録なし</span>
  </details>
</main>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

const MODEL_URL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const WASM_URL="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";
const RECORD_SECONDS=5;
const PLAYBACK_FPS=60;
const MAX_INTERP_GAP=0.20;
const V_ARROW_TIME=0.105;
const A_ARROW_TIME2=0.085;
const TRACK_GAP_RESET_MS=260;

const liveVideo=document.getElementById("liveVideo");
const playbackVideo=document.getElementById("playbackVideo");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const stage=document.getElementById("stage");
const startBtn=document.getElementById("startBtn");
const recordBtn=document.getElementById("recordBtn");
const playBtn=document.getElementById("playBtn");
const pauseBtn=document.getElementById("pauseBtn");
const liveBtn=document.getElementById("liveBtn");
const toggleBtn=document.getElementById("toggleBtn");
const stopBtn=document.getElementById("stopBtn");
const statusEl=document.getElementById("status");
const accelBadge=document.getElementById("accelBadge");
const message=document.getElementById("message");
const recordBadge=document.getElementById("recordBadge");
const recordText=document.getElementById("recordText");
const recordProgress=document.getElementById("recordProgress");
const clipInfo=document.getElementById("clipInfo");
const vScale=document.getElementById("vScale");
const aScale=document.getElementById("aScale");
const smoothScale=document.getElementById("smoothScale");
const vScaleValue=document.getElementById("vScaleValue");
const aScaleValue=document.getElementById("aScaleValue");
const smoothScaleValue=document.getElementById("smoothScaleValue");
const graphsSection=document.getElementById("graphsSection");
const graphCanvases={
  x:document.getElementById("graphX"),y:document.getElementById("graphY"),
  vx:document.getElementById("graphVx"),vy:document.getElementById("graphVy"),
  ax:document.getElementById("graphAx"),ay:document.getElementById("graphAy")
};
const graphPlayheads=[...document.querySelectorAll(".graph-playhead")];

let handLandmarker=null;
let stream=null;
let running=false;
let rafId=null;
let lastInferenceMs=0;
let lastVideoTime=-1;
let showAcceleration=true;
let messageTimer=null;
let mode="live";

const ua=navigator.userAgent||"";
const isIOSLike=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const INFERENCE_INTERVAL_MS=isIOSLike?72:52;

let filteredPos=null,previousPos=null,previousSampleMs=null,lastSeenMs=null;
let previousVel={x:0,y:0},filteredVel={x:0,y:0},filteredAcc={x:0,y:0};

let mediaRecorder=null;
let mediaChunks=[];
let recording=false;
let countingDown=false;
let recordStartPerf=0;
let recordStopTimer=null;
let recordUiRaf=null;
let recordSamples=[];
let recordedDuration=0;
let recordedBlob=null;
let playbackUrl=null;
let processedFrames=[];
let processedDt=1/PLAYBACK_FPS;
let lastProcessedStrength=null;

function setStatus(t){statusEl.textContent=t}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function lerpPoint(a,b,t){return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}}
function magnitude(v){return Math.hypot(v.x,v.y)}
function smoothingAlphas(){const s=Number(smoothScale.value)/100;return{pos:lerp(.80,.20,s),vel:lerp(.65,.08,s),acc:lerp(.45,.03,s)}}

function updateAccelBadge(){accelBadge.innerHTML=showAcceleration?'加速度表示：<span class="accel-on">ON</span>':'加速度表示：<span class="accel-off">OFF</span>'}
function flashMessage(t){clearTimeout(messageTimer);message.classList.remove("countdown");message.textContent=t;message.classList.add("show");messageTimer=setTimeout(()=>message.classList.remove("show"),1000)}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function runRecordCountdown(){
  countingDown=true;
  recordBtn.disabled=true;playBtn.disabled=true;liveBtn.disabled=true;stopBtn.disabled=true;
  clearTimeout(messageTimer);
  for(let n=3;n>=1;n--){
    if(!running||!stream){countingDown=false;message.classList.remove("show","countdown");return false}
    message.textContent=String(n);message.classList.add("show","countdown");setStatus(`記録開始まで ${n}`);
    await wait(1000);
  }
  message.classList.remove("show","countdown");countingDown=false;
  return running&&!!stream;
}
function toggleAcceleration(){showAcceleration=!showAcceleration;updateAccelBadge();filteredAcc={x:0,y:0};flashMessage(showAcceleration?"加速度 ON":"加速度 OFF")}

function resetMotion(){filteredPos=null;previousPos=null;previousSampleMs=null;lastSeenMs=null;previousVel={x:0,y:0};filteredVel={x:0,y:0};filteredAcc={x:0,y:0};ctx.clearRect(0,0,canvas.width,canvas.height)}

function palmCenterNormalized(landmarks){
  const ids=[0,5,9,13,17];let x=0,y=0;
  for(const i of ids){x+=landmarks[i].x;y+=landmarks[i].y}
  x/=ids.length;y/=ids.length;
  return{x:1-x,y};
}
function normalizedToPixels(p){return{x:p.x*canvas.width,y:p.y*canvas.height}}

function updateMotion(rawPos,now){
  if(lastSeenMs!==null&&now-lastSeenMs>TRACK_GAP_RESET_MS)resetMotion();
  lastSeenMs=now;
  if(!filteredPos){filteredPos={...rawPos};previousPos={...rawPos};previousSampleMs=now;return}
  const alpha=smoothingAlphas();
  filteredPos=lerpPoint(filteredPos,rawPos,alpha.pos);
  const dt=(now-previousSampleMs)/1000;
  if(dt<.018)return;
  if(dt>.22){previousPos={...filteredPos};previousSampleMs=now;previousVel={x:0,y:0};filteredVel={x:0,y:0};filteredAcc={x:0,y:0};return}
  const rawVel={x:(filteredPos.x-previousPos.x)/dt,y:(filteredPos.y-previousPos.y)/dt};
  const newVel={x:lerp(filteredVel.x,rawVel.x,alpha.vel),y:lerp(filteredVel.y,rawVel.y,alpha.vel)};
  const rawAcc={x:(newVel.x-previousVel.x)/dt,y:(newVel.y-previousVel.y)/dt};
  filteredAcc={x:lerp(filteredAcc.x,rawAcc.x,alpha.acc),y:lerp(filteredAcc.y,rawAcc.y,alpha.acc)};
  previousVel={...newVel};filteredVel=newVel;previousPos={...filteredPos};previousSampleMs=now;
}

function clampVector(v,maxLen){const m=magnitude(v);if(m<=maxLen||m===0)return v;const s=maxLen/m;return{x:v.x*s,y:v.y*s}}
function drawArrow(start,vec,color,label,minLen=7){
  const v=clampVector(vec,Math.min(canvas.width,canvas.height)*.46);const len=magnitude(v);if(len<minLen)return;
  const end={x:start.x+v.x,y:start.y+v.y};const angle=Math.atan2(v.y,v.x);const head=Math.max(13,Math.min(28,len*.22));const lw=Math.max(5,Math.min(10,canvas.width/150));
  ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=5;
  ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(end.x,end.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(end.x,end.y);ctx.lineTo(end.x-head*Math.cos(angle-Math.PI/7),end.y-head*Math.sin(angle-Math.PI/7));ctx.lineTo(end.x-head*Math.cos(angle+Math.PI/7),end.y-head*Math.sin(angle+Math.PI/7));ctx.closePath();ctx.fill();
  const fs=Math.max(22,Math.min(40,canvas.width/34));ctx.font=`900 ${fs}px -apple-system,BlinkMacSystemFont,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=7;ctx.strokeStyle="rgba(0,0,0,.8)";const tx=end.x+Math.cos(angle)*24,ty=end.y+Math.sin(angle)*24;ctx.strokeText(label,tx,ty);ctx.fillStyle=color;ctx.fillText(label,tx,ty);ctx.restore();
}
function drawVectors(pos,vel,acc){
  ctx.clearRect(0,0,canvas.width,canvas.height);if(!pos)return;
  ctx.save();ctx.beginPath();ctx.arc(pos.x,pos.y,10,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,.95)";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="rgba(0,0,0,.75)";ctx.stroke();ctx.restore();
  const vv={x:vel.x*V_ARROW_TIME*Number(vScale.value),y:vel.y*V_ARROW_TIME*Number(vScale.value)};drawArrow(pos,vv,"#1683ff","v",8);
  if(showAcceleration){const aa={x:acc.x*A_ARROW_TIME2*Number(aScale.value),y:acc.y*A_ARROW_TIME2*Number(aScale.value)};drawArrow(pos,aa,"#ff3b30","a",9)}
}
function drawLiveFrame(){drawVectors(filteredPos,filteredVel,filteredAcc)}

async function initHandLandmarker(){
  if(handLandmarker)return;setStatus("手の認識モデルを読み込み中…");
  const vision=await FilesetResolver.forVisionTasks(WASM_URL);
  const options={baseOptions:{modelAssetPath:MODEL_URL,delegate:"GPU"},runningMode:"VIDEO",numHands:1,minHandDetectionConfidence:.55,minHandPresenceConfidence:.55,minTrackingConfidence:.55};
  try{handLandmarker=await HandLandmarker.createFromOptions(vision,options)}catch(e){console.warn(e);options.baseOptions.delegate="CPU";handLandmarker=await HandLandmarker.createFromOptions(vision,options)}
}

async function startCamera(){
  if(running)return;startBtn.disabled=true;
  try{
    await initHandLandmarker();setStatus("カメラを起動中…");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:60}},audio:false});
    liveVideo.srcObject=stream;await liveVideo.play();
    canvas.width=liveVideo.videoWidth||1280;canvas.height=liveVideo.videoHeight||720;stage.style.aspectRatio=`${canvas.width} / ${canvas.height}`;
    running=true;mode="live";stage.classList.remove("playback");resetMotion();
    startBtn.textContent="カメラ動作中";recordBtn.disabled=!supportsMediaRecording();toggleBtn.disabled=false;stopBtn.disabled=false;liveBtn.disabled=true;
    setStatus(supportsMediaRecording()?"手を追跡中":"このブラウザは映像記録に未対応です");loop();
  }catch(e){console.error(e);setStatus("カメラを開始できません。Safari/Chromeのカメラ許可を確認してください。");startBtn.disabled=false}
}

function stopCamera(){
  if(recording||countingDown)return;
  running=false;if(rafId)cancelAnimationFrame(rafId);rafId=null;
  if(stream){for(const t of stream.getTracks())t.stop();stream=null}
  liveVideo.srcObject=null;resetMotion();startBtn.disabled=false;startBtn.textContent="カメラ開始";recordBtn.disabled=true;toggleBtn.disabled=true;stopBtn.disabled=true;liveBtn.disabled=recordedBlob===null;setStatus("カメラ停止中。記録済み映像は再生できます。")
}

function supportsMediaRecording(){return typeof MediaRecorder!=="undefined"&&!!stream}
function chooseMimeType(){
  const mp4=["video/mp4;codecs=avc1.42E01E","video/mp4"];
  const webm=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  const list=isIOSLike?[...mp4,...webm]:[...webm,...mp4];
  return list.find(t=>MediaRecorder.isTypeSupported?.(t))||"";
}

function updateRecordUi(){
  if(!recording)return;const elapsed=(performance.now()-recordStartPerf)/1000;const remain=Math.max(0,RECORD_SECONDS-elapsed);recordText.textContent=`記録中 ${remain.toFixed(1)} s`;recordProgress.style.width=`${clamp(elapsed/RECORD_SECONDS*100,0,100)}%`;setStatus(`記録中… ${remain.toFixed(1)} 秒`);recordUiRaf=requestAnimationFrame(updateRecordUi)
}

function clearPreviousRecording(){
  if(playbackUrl){URL.revokeObjectURL(playbackUrl);playbackUrl=null}
  recordedBlob=null;processedFrames=[];recordSamples=[];recordedDuration=0;lastProcessedStrength=null;playbackVideo.removeAttribute("src");playbackVideo.load();playBtn.disabled=true;pauseBtn.disabled=true;clipInfo.textContent="記録なし";graphsSection.classList.remove("show","playing","paused")
}

async function startRecording(){
  if(!running||!stream||recording||countingDown||!supportsMediaRecording())return;
  switchToLive(false);clearPreviousRecording();
  const ready=await runRecordCountdown();
  if(!ready){recordBtn.disabled=!running;stopBtn.disabled=!running;return}
  const mime=chooseMimeType();const options={videoBitsPerSecond:2500000};if(mime)options.mimeType=mime;
  try{mediaRecorder=new MediaRecorder(stream,options)}catch(e){console.error(e);setStatus("このブラウザでは録画形式を開始できませんでした");recordBtn.disabled=!running;stopBtn.disabled=!running;return}
  mediaChunks=[];recordSamples=[];mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)mediaChunks.push(e.data)};
  mediaRecorder.onerror=e=>{console.error(e);finishRecordingUi();setStatus("録画中にエラーが発生しました")};
  mediaRecorder.onstop=finalizeRecording;
  try{mediaRecorder.start(200)}catch(e){console.error(e);setStatus("録画を開始できませんでした");recordBtn.disabled=!running;stopBtn.disabled=!running;return}
  recordStartPerf=performance.now();recording=true;recordBadge.classList.add("show");recordProgress.style.width="0%";recordBtn.disabled=true;playBtn.disabled=true;liveBtn.disabled=true;stopBtn.disabled=true;flashMessage("記録開始");updateRecordUi();
  recordStopTimer=setTimeout(()=>{if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop()},RECORD_SECONDS*1000);
}

function finishRecordingUi(){
  recording=false;clearTimeout(recordStopTimer);recordStopTimer=null;if(recordUiRaf)cancelAnimationFrame(recordUiRaf);recordUiRaf=null;recordBadge.classList.remove("show");recordProgress.style.width="0%";recordBtn.disabled=!running;stopBtn.disabled=!running
}

async function finalizeRecording(){
  recordedDuration=Math.min(RECORD_SECONDS,(performance.now()-recordStartPerf)/1000);finishRecordingUi();
  if(mediaChunks.length===0){setStatus("録画データを作れませんでした");return}
  const type=mediaRecorder?.mimeType||mediaChunks[0]?.type||"video/mp4";recordedBlob=new Blob(mediaChunks,{type});playbackUrl=URL.createObjectURL(recordedBlob);playbackVideo.src=playbackUrl;playbackVideo.load();
  try{await waitForMetadata(playbackVideo)}catch(e){console.warn(e)}
  preparePlaybackData();renderGraphs();playBtn.disabled=false;liveBtn.disabled=false;clipInfo.textContent=`記録済み：約 ${recordedDuration.toFixed(1)} 秒 / ${recordSamples.filter(s=>s.valid).length} 点`;setStatus("5秒記録完了。『再生』で録画映像＋平滑化ベクトルを確認できます。");flashMessage("記録完了")
}

function waitForMetadata(v){return new Promise((resolve,reject)=>{if(v.readyState>=1){resolve();return}const ok=()=>{cleanup();resolve()};const ng=()=>{cleanup();reject(new Error("metadata error"))};const cleanup=()=>{v.removeEventListener("loadedmetadata",ok);v.removeEventListener("error",ng)};v.addEventListener("loadedmetadata",ok,{once:true});v.addEventListener("error",ng,{once:true})})}

function recordTrackingSample(now,norm){
  if(!recording||!norm)return;
  const t=(now-recordStartPerf)/1000;
  if(t<-.05||t>RECORD_SECONDS+.15)return;
  // 短い認識落ちは、前後の有効点を補間して吸収する。長い認識落ちは MAX_INTERP_GAP で自動的に空白になる。
  recordSamples.push({t:Math.max(0,t),valid:true,x:norm.x,y:norm.y});
}

function gaussianKernel(sigma){
  const radius=Math.max(1,Math.ceil(sigma*3));const k=[];let sum=0;for(let i=-radius;i<=radius;i++){const w=Math.exp(-(i*i)/(2*sigma*sigma));k.push(w);sum+=w}return k.map(x=>x/sum)
}
function smoothArray(values,sigma){
  if(values.length<3||sigma<=.1)return values.slice();const k=gaussianKernel(sigma),r=(k.length-1)/2,out=new Array(values.length);
  for(let i=0;i<values.length;i++){let s=0,w=0;for(let j=-r;j<=r;j++){const q=clamp(i+j,0,values.length-1);s+=values[q]*k[j+r];w+=k[j+r]}out[i]=s/w}return out
}

function resampleRecording(){
  const dt=1/PLAYBACK_FPS;const n=Math.max(2,Math.floor(recordedDuration/dt)+1);const out=new Array(n).fill(null);if(recordSamples.length<2)return{dt,points:out};
  let j=0;
  for(let i=0;i<n;i++){
    const t=i*dt;while(j+1<recordSamples.length&&recordSamples[j+1].t<t)j++;
    const a=recordSamples[j],b=recordSamples[Math.min(j+1,recordSamples.length-1)];
    if(!a||!b||!a.valid||!b.valid||b.t-a.t>MAX_INTERP_GAP||t<a.t-.001||t>b.t+.001)continue;
    const u=b.t===a.t?0:clamp((t-a.t)/(b.t-a.t),0,1);out[i]={x:lerp(a.x,b.x,u)*canvas.width,y:lerp(a.y,b.y,u)*canvas.height};
  }
  return{dt,points:out}
}

function preparePlaybackData(){
  if(!recordedBlob||recordSamples.length<2)return;
  const strength=Number(smoothScale.value);const {dt,points}=resampleRecording();processedDt=dt;processedFrames=new Array(points.length).fill(null);
  const baseSigma=lerp(1.4,12,strength/100);
  let start=0;
  while(start<points.length){while(start<points.length&&!points[start])start++;if(start>=points.length)break;let end=start;while(end+1<points.length&&points[end+1])end++;
    const len=end-start+1;if(len>=5){
      const xs=[],ys=[];for(let i=start;i<=end;i++){xs.push(points[i].x);ys.push(points[i].y)}
      const sx=smoothArray(xs,baseSigma),sy=smoothArray(ys,baseSigma);const vx=new Array(len).fill(0),vy=new Array(len).fill(0);
      for(let i=0;i<len;i++){const lo=Math.max(0,i-1),hi=Math.min(len-1,i+1),den=(hi-lo)*dt||dt;vx[i]=(sx[hi]-sx[lo])/den;vy[i]=(sy[hi]-sy[lo])/den}
      const svx=smoothArray(vx,Math.max(.7,baseSigma*.7)),svy=smoothArray(vy,Math.max(.7,baseSigma*.7));const ax=new Array(len).fill(0),ay=new Array(len).fill(0);
      for(let i=0;i<len;i++){const lo=Math.max(0,i-1),hi=Math.min(len-1,i+1),den=(hi-lo)*dt||dt;ax[i]=(svx[hi]-svx[lo])/den;ay[i]=(svy[hi]-svy[lo])/den}
      const sax=smoothArray(ax,Math.max(1,baseSigma*1.15)),say=smoothArray(ay,Math.max(1,baseSigma*1.15));
      for(let i=0;i<len;i++)processedFrames[start+i]={pos:{x:sx[i],y:sy[i]},vel:{x:svx[i],y:svy[i]},acc:{x:sax[i],y:say[i]}};
    }
    start=end+1;
  }
  lastProcessedStrength=strength;
}

function graphSeries(){
  return processedFrames.map((f,i)=>{
    if(!f)return null;
    return{
      t:i*processedDt,
      x:f.pos.x-canvas.width/2,
      y:canvas.height/2-f.pos.y,
      vx:f.vel.x,
      vy:-f.vel.y,
      ax:f.acc.x,
      ay:-f.acc.y
    };
  });
}
function niceScale(maxAbs){
  if(!Number.isFinite(maxAbs)||maxAbs<=0)return 1;
  const target=maxAbs*1.08,pow=10**Math.floor(Math.log10(target)),n=target/pow;
  const nice=n<=1?1:n<=2?2:n<=5?5:10;
  return nice*pow;
}
function maxAbsFor(series,keys){
  let m=0;for(const row of series){if(!row)continue;for(const k of keys){const v=row[k];if(Number.isFinite(v))m=Math.max(m,Math.abs(v))}}return m;
}
function formatGraphNumber(v){
  const a=Math.abs(v);if(a>=1000)return `${(v/1000).toFixed(a>=10000?0:1)}k`;if(a>=100)return v.toFixed(0);if(a>=10)return v.toFixed(1);return v.toFixed(2);
}
function sizeGraphCanvas(c){
  const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(160,c.clientWidth),h=Math.max(110,c.clientHeight);
  const rw=Math.round(w*dpr),rh=Math.round(h*dpr);if(c.width!==rw||c.height!==rh){c.width=rw;c.height=rh}const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);return{g,w,h};
}
function drawGraph(c,series,key,scale,unit,color){
  const {g,w,h}=sizeGraphCanvas(c);g.clearRect(0,0,w,h);g.fillStyle="#0d0e11";g.fillRect(0,0,w,h);
  const M={l:43,r:10,t:12,b:25},pw=Math.max(1,w-M.l-M.r),ph=Math.max(1,h-M.t-M.b),tMax=Math.max(.1,recordedDuration||RECORD_SECONDS);
  const X=t=>M.l+clamp(t/tMax,0,1)*pw,Y=v=>M.t+(scale-v)/(2*scale)*ph;
  g.font='11px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif';g.textBaseline="middle";
  g.strokeStyle="#262932";g.lineWidth=2;
  for(let s=0;s<=Math.ceil(tMax);s++){const x=X(Math.min(s,tMax));g.beginPath();g.moveTo(x,M.t);g.lineTo(x,M.t+ph);g.stroke();g.fillStyle="#8f949e";g.textAlign="center";g.fillText(String(s),x,h-9)}
  for(const q of [-1,-.5,0,.5,1]){const y=Y(q*scale);g.beginPath();g.moveTo(M.l,y);g.lineTo(M.l+pw,y);g.stroke()}
  g.strokeStyle="#727782";g.lineWidth=2.4;g.beginPath();g.moveTo(M.l,Y(0));g.lineTo(M.l+pw,Y(0));g.stroke();
  g.fillStyle="#aeb3bd";g.textAlign="right";g.fillText(formatGraphNumber(scale),M.l-5,Y(scale));
  g.fillText("0",M.l-5,Y(0));g.fillText(formatGraphNumber(-scale),M.l-5,Y(-scale));
  g.textAlign="right";g.textBaseline="top";g.fillStyle="#aeb3bd";g.fillText(`±${formatGraphNumber(scale)} ${unit}`,w-M.r,M.t+2);
  g.textAlign="right";g.textBaseline="alphabetic";g.fillText("t (s)",w-M.r,h-4);
  g.strokeStyle=color;g.lineWidth=2.4;g.lineJoin="round";g.lineCap="round";let started=false;g.beginPath();
  for(const row of series){if(!row||!Number.isFinite(row[key])){started=false;continue}const x=X(row.t),y=Y(clamp(row[key],-scale,scale));if(!started){g.moveTo(x,y);started=true}else g.lineTo(x,y)}g.stroke();
}
function renderGraphs(){
  if(!recordedBlob||!processedFrames.length)return;
  const series=graphSeries();
  const pScale=niceScale(maxAbsFor(series,["x","y"])),vScaleG=niceScale(maxAbsFor(series,["vx","vy"])),aScaleG=niceScale(maxAbsFor(series,["ax","ay"]));
  drawGraph(graphCanvases.x,series,"x",pScale,"px","#f2f2f3");drawGraph(graphCanvases.y,series,"y",pScale,"px","#f2f2f3");
  drawGraph(graphCanvases.vx,series,"vx",vScaleG,"px/s","#1683ff");drawGraph(graphCanvases.vy,series,"vy",vScaleG,"px/s","#1683ff");
  drawGraph(graphCanvases.ax,series,"ax",aScaleG,"px/s²","#ff3b30");drawGraph(graphCanvases.ay,series,"ay",aScaleG,"px/s²","#ff3b30");
  graphsSection.classList.add("show");updateGraphPlayheads(playbackVideo.currentTime||0);
}
function updateGraphPlayheads(t){
  if(!recordedBlob)return;const tMax=Math.max(.1,recordedDuration||RECORD_SECONDS),frac=clamp(t/tMax,0,1);
  for(const el of graphPlayheads){const plot=el.parentElement,w=plot.clientWidth,Ml=43,Mr=10;el.style.left=`${Ml+frac*Math.max(1,w-Ml-Mr)}px`}
}

function playbackFrameAt(t){
  if(!processedFrames.length)return null;const f=clamp(t/processedDt,0,processedFrames.length-1),i=Math.floor(f),j=Math.min(processedFrames.length-1,i+1),u=f-i,a=processedFrames[i],b=processedFrames[j];if(!a||!b)return a||b||null;
  return{pos:lerpPoint(a.pos,b.pos,u),vel:lerpPoint(a.vel,b.vel,u),acc:lerpPoint(a.acc,b.acc,u)}
}
function drawPlaybackFrame(){const t=playbackVideo.currentTime||0;const f=playbackFrameAt(t);if(f)drawVectors(f.pos,f.vel,f.acc);else ctx.clearRect(0,0,canvas.width,canvas.height);updateGraphPlayheads(t)}

async function playRecording(){
  if(!recordedBlob)return;if(lastProcessedStrength!==Number(smoothScale.value))preparePlaybackData();
  mode="playback";stage.classList.add("playback");graphsSection.classList.add("playing");graphsSection.classList.remove("paused");liveBtn.disabled=false;pauseBtn.disabled=false;recordBtn.disabled=true;
  if(!rafId)loop();
  if(playbackVideo.ended||playbackVideo.currentTime>=Math.max(0,(playbackVideo.duration||recordedDuration)-.04))playbackVideo.currentTime=0;
  try{await playbackVideo.play();setStatus(`録画再生中：平滑化 ${smoothScale.value}%`)}catch(e){console.error(e);setStatus("再生を開始できませんでした")}
}
function pausePlayback(){if(!recordedBlob)return;playbackVideo.pause();mode="playbackPaused";graphsSection.classList.remove("playing");graphsSection.classList.add("paused");pauseBtn.disabled=true;setStatus(`一時停止 ${playbackVideo.currentTime.toFixed(1)} s`);drawPlaybackFrame()}
function switchToLive(reset=true){
  playbackVideo.pause();mode="live";stage.classList.remove("playback");graphsSection.classList.remove("playing","paused");pauseBtn.disabled=true;liveBtn.disabled=true;if(running){recordBtn.disabled=false;setStatus("ライブ表示");if(reset)resetMotion()}ctx.clearRect(0,0,canvas.width,canvas.height)
}

function loop(){
  if(!running&&mode==="live"){rafId=null;return}
  const now=performance.now();
  if(mode==="live"){
    if(running&&liveVideo.readyState>=2&&now-lastInferenceMs>=INFERENCE_INTERVAL_MS&&liveVideo.currentTime!==lastVideoTime){
      lastInferenceMs=now;lastVideoTime=liveVideo.currentTime;
      try{
        const result=handLandmarker.detectForVideo(liveVideo,now);
        if(result.landmarks&&result.landmarks.length){const norm=palmCenterNormalized(result.landmarks[0]);const p=normalizedToPixels(norm);updateMotion(p,now);recordTrackingSample(now,norm);if(!recording&&!countingDown)setStatus("手を追跡中")}
        else{recordTrackingSample(now,null);if(lastSeenMs!==null&&now-lastSeenMs>TRACK_GAP_RESET_MS)resetMotion();if(!recording&&!countingDown)setStatus("手をカメラに映してください")}
      }catch(e){console.warn(e)}
    }
    drawLiveFrame();
  }else{drawPlaybackFrame()}
  rafId=requestAnimationFrame(loop)
}

startBtn.addEventListener("click",startCamera);recordBtn.addEventListener("click",startRecording);playBtn.addEventListener("click",playRecording);pauseBtn.addEventListener("click",pausePlayback);liveBtn.addEventListener("click",()=>switchToLive(true));toggleBtn.addEventListener("click",toggleAcceleration);stopBtn.addEventListener("click",stopCamera);
playbackVideo.addEventListener("ended",()=>{mode="playbackPaused";graphsSection.classList.remove("playing");graphsSection.classList.add("paused");pauseBtn.disabled=true;setStatus("再生終了。『再生』でもう一度見られます。");drawPlaybackFrame()});
playbackVideo.addEventListener("pause",()=>{if(mode==="playback")pauseBtn.disabled=true});
playbackVideo.addEventListener("play",()=>{pauseBtn.disabled=false});
vScale.addEventListener("input",()=>{vScaleValue.textContent=Number(vScale.value).toFixed(2)});
aScale.addEventListener("input",()=>{aScaleValue.textContent=Number(aScale.value).toFixed(2)});
smoothScale.addEventListener("input",()=>{smoothScaleValue.textContent=`${Number(smoothScale.value)}%`;if(recordedBlob){preparePlaybackData();renderGraphs();if(mode!=="live")drawPlaybackFrame()}});
let graphResizeTimer=null;window.addEventListener("resize",()=>{if(!recordedBlob)return;clearTimeout(graphResizeTimer);graphResizeTimer=setTimeout(renderGraphs,100)});
window.addEventListener("pagehide",()=>{if(playbackUrl)URL.revokeObjectURL(playbackUrl);if(stream){for(const t of stream.getTracks())t.stop()}});

updateAccelBadge();
</script>
</body>
